<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alumni Sign Up</title>
    <link rel="stylesheet" href="alumni.css">
</head>
<body>
    <div class="signup-container">
        <h2 id="signup-title">Alumni Sign Up</h2>
        
        <form id="alumni-form" class="signup-form">
            <label for="alumni-name">Full Name:</label>
            <input type="text" id="alumni-name" name="name" required>
            <label for="alumni-prn">PRN Number:</label>
            <input type="text" id="alumni-prn" name="prn" required>
            <label for="alumni-batch">Batch:</label>
            <input type="text" id="alumni-batch" name="batch" required>
            <label for="alumni-department">Department:</label>
            <input type="text" id="alumni-department" name="department" required>
            <label for="alumni-contact">Contact Details:</label>
            <input type="text" id="alumni-contact" name="contact" required>
            <label for="alumni-id">Alumni ID:</label>
            <input type="text" id="alumni-id" name="id" required>
            <label for="alumni-doc">College Document:</label>
            <input type="text" id="alumni-doc" name="collegeDoc" required>
            <label for="alumni-email">Email:</label>
            <input type="email" id="alumni-email" name="email" required>
            <label for="alumni-password">Create Password:</label>
            <input type="password" id="alumni-password" name="password" required>
            <button type="submit">Sign Up</button>
        </form>

        <p class="login-link switch-link">Not an Alumni? <a href="signup-selection.html">Switch Account Type</a></p>
    </div>
    <script src="signup-form-logic.js"></script>
</body>
</html>
