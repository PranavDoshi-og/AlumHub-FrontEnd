<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Account Type</title>
    <link rel="stylesheet" href="signup.css">
</head>
<body>
    <div class="signup-container">
        <h2 id="signup-title">Sign Up</h2>
        
        <div class="user-type-selector-wrapper">
            <div class="user-type-selector" id="user-type-cards">
                <div class="selection-card" data-type="alumni">
                    <h3>Alumni</h3>
                </div>
                <div class="selection-card" data-type="administration">
                    <h3>Admin</h3>
                </div>
                <div class="selection-card" data-type="student">
                    <h3>Student</h3>
                </div>
            </div>
        </div>

    </div>
    <script src="signup-selection.js"></script>
</body>
</html>
